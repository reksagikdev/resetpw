<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESET PASSWORD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family: 'Inter', sans-serif;
    letter-spacing:0.3px;
}

.title{
    color:white;
    font-size:24px;
    margin-bottom:12px;
    letter-spacing:2px;
    text-align:center;
    text-shadow:0 4px 12px rgba(0,0,0,.4);

    position:relative;
    padding-bottom:5px;
}

.title::after{
    content:"";
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:200px;
    height:3px;

    border-radius:10px;

    background:linear-gradient(
        90deg,
        transparent,
        #60a5fa,
        #ffffff,
        #60a5fa,
        transparent
    );

    box-shadow:
        0 0 10px rgba(96,165,250,0.7),
        0 0 18px rgba(255,255,255,0.35);
}

body{
    min-height: 100vh;
    margin: 0;
    padding: 0 0 80px;
    background: url("bg/gambar6.jpg") center/cover no-repeat;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
}

html, body{
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(4px);
    z-index:0;
}

.container{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;

    margin: 40px auto;
    padding: 26px 22px 18px;

    border-radius: 24px;

    border: 2px solid rgba(59, 130, 246, 0.7);
    background: url("bg/gambar9.jpg")center;
	
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        0 18px 45px rgba(0,0,0,0.55),
        0 0 20px rgba(30,58,138,0.35);

    transition: 0.3s ease;

    animation: fadeUp 0.6s ease;
	padding-bottom: 30px;
}

.input-box{
    margin-bottom:18px;
    animation:fadeDown .5s ease;
}

input{
    width:100%;
    height:56px;

    appearance:none;
    -webkit-appearance:none;

    padding:16px 18px;
    border:none;
    outline:none;
    border-radius:18px;

    font-size:16px;
    
    text-align:center;

    background: rgba(2, 6, 23, 0.6);
    border: 1px solid rgba(59, 130, 246, 0.7);

    box-shadow: 0 0 12px rgba(59,130,246,0.25);

    color:#ffffff;

    transition: box-shadow .25s ease;
}

input:focus{
    box-shadow:
        0 0 0 2px rgba(59,130,246,0.45),
        0 8px 22px rgba(0,0,0,0.22),
        inset 0 1px 6px rgba(255,255,255,0.04);
}

input::placeholder{
    color:rgba(255,255,255,.75);
}

.forgot{
    margin-top:10px;
    text-align:center;
    color:#8fffc0;
    font-size:14px;
    font-weight:bold;
    transition:.25s;
}

.forgot:hover{
    color:#fff;
}

.card{
    border-radius:20px;
    font-size:16px;
    font-weight:bold;
    min-height:230px;
    text-align:left;

    color:#ffffff;
    padding:30px;

    background: url("bg/gambar6.jpg")center;
    border: 1px solid rgba(59, 130, 246, 0.7);

    box-shadow:
        0 30px 40px rgba(0,0,0,0.35),
        0 0 12px rgba(59,130,246,0.25);

    transition:.25s ease;
    overflow:hidden;
}

.card p{
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 16px;

    color: #ffffff;

    border-radius: 12px;
    background: rgba(2, 6, 23, 0.6);
    border: 1px solid rgba(59, 130, 246, 0.7);
    box-shadow: 0 0 12px rgba(59,130,246,0.25);
}

#usernameText,
#password{
    color:#ffffff;
    font-weight:600;
	
}


.label{
    font-weight: 600;
    color: #60a5fa;
}

.box {
         position: relative;
    	 top: 30px;
    }

button {
     width:100%;
  max-width:180px;

  padding:12px;
  border-radius:10px;

  background:#1e3a8a;
  color:white;

  border:1px solid #3b82f6;

  box-shadow:0 6px 15px rgba(0,0,0,0.25);

  cursor:pointer;
  transition:0.25s ease;
  display:block;
  margin:0 auto;
  text-shadow:0 4px 12px rgba(0,0,0,.4);
}

.btn-shadow:hover{
  
  box-shadow:
    0 10px 25px rgba(0,0,0,0.35),
    0 0 12px rgba(59,130,246,0.6);

  background:#2563eb;
}

#copyBtn{
    margin:14px auto 0;

    width:130px;
    height:42px;

    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#1e3a8a,#0ea5e9);

    color:#fff;
    font-size:13px;
    font-weight:700;
	border:1px solid #3b82f6;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    transition:
        box-shadow .25s ease,
        opacity .2s ease;

    box-shadow:
        0 6px 16px rgba(0,0,0,.25),
        0 0 10px rgba(59,130,246,.25);
}

#copyBtn::before{
    content:"";

    position:absolute;
    top:0;
    left:-120%;

    width:12%;
filter:blur(1px);
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.35),
        rgba(255,255,255,0.08),
        transparent
    );

    transform:skewX(-25deg);

    animation:shineMove 3.2s linear infinite;
}

@keyframes shineMove{
    0%{
        left:-120%;
    }

    100%{
        left:160%;
    }
}

.card{
    overflow:hidden;
}

#copyBtn:hover{
    box-shadow:
        0 0 20px rgba(37,99,235,.5),
        0 8px 18px rgba(0,0,0,.25);
}

#copyBtn:active{
    opacity:0.92;
}

#copyBtn.success{
    background:#22c55e !important;

    box-shadow:
        0 12px 25px rgba(0,0,0,.3),
        0 0 15px rgba(34,197,94,.5);
}

@keyframes premiumShine{
    0%{
        left:-70%;
    }
    45%{
        left:140%;
    }
    100%{
        left:140%;
	}
	
}

.brand{
    position:relative;
    z-index:5;

    text-align:center;

    color:#ffffff;
    font-size:11px;
    font-weight:700;

    margin-top:-28px;

    letter-spacing:0.5px;

    text-shadow:
        0 1px 2px rgba(0,0,0,0.6);
}
	
</style>
</head>
<body>

<div class="overlay"></div>

<div class="container">

    <div class="input-box">
       <h2 class="title">⚡RESET PASSWORD⚡</h2>
	
	   <input type="text" id="username" placeholder="Masukkan Username" oninput="generateData()">
		
    </div>

    <div class="card">
    <p>🧑 Username : <span id="usernameText"></span></p>
    <p>🔒 Password : <span id="password"></span></p>

    <button id="copyBtn" onclick="copyData()">SALIN</button>
</div>

</div>

<div class="brand">
    © 2026 | BY YOGIK
</div>

<script>
function generateData() {
    let username = document.getElementById("username").value;

    if (username === "") {
        document.getElementById("usernameText").innerText = "";
        document.getElementById("password").innerText = "";
        return;
    }

    let angka = Math.floor(100 + Math.random() * 900);

    let words = [
        "mantap", "gambar", "teko", "kasti", "lomba", "mujur", "balap", "berani", "keren", "gas", "santai", "kereta", "jos", "awan", "buku", "dermaga", "embun", "gitar", "hujan", "impian", "jangkar", "kopi", "langit", "malam", "nyala", "ombak", "pintu", "quiz", "rumah", "senja", "tanah", "vokal", "bayang", "cahaya", "daun", "gelap", "hati", "ikan", "jarak", "antar", "baris", "klik", "kartu", "format", "rapi", "urusan", "lapar", "langkah", "boleh", "ringan", "singkat", "berani", "tumbuh", "kawan", "berjuang", "pernah", "cahaya", "harapan", "bijak", "petualangan", "solusi", "gairah", "bergerak", "jago", "runcing", "super", "kapal", "madu", "oke"
    ];

    let randomWord = words[Math.floor(Math.random() * words.length)];

    let password = randomWord + angka;

    document.getElementById("usernameText").innerText = username;
    document.getElementById("password").innerText = password;
}

function copyData() {
    let u = document.getElementById("usernameText").innerText;
    let p = document.getElementById("password").innerText;

    if(!u || !p) return;

    let text = `Username: ${u}\nPassword: ${p} \n\nGunakan link alternatif dibawah ini jika tidak bisa akses situs : \nhttps://gesya.me/mnttutama`;
	

    navigator.clipboard.writeText(text).then(()=>{

        let btn = document.getElementById("copyBtn");

        // reset class dulu biar animasi selalu jalan
        btn.classList.remove("success");
        void btn.offsetWidth;

        btn.classList.add("success");
        btn.innerText = "✔";

        // HANYA RESET INPUT
        let input = document.getElementById("username");

input.value = "";
input.blur();

        setTimeout(()=>{
            btn.classList.remove("success");
            btn.innerText = "SALIN";
        },1200);
    });
}
</script>
</body>
</html>
