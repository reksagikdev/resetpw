<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESET PASSWORD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Outfit',sans-serif;
    letter-spacing:0.3px;
}

.title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    font-size:34px;
    font-weight:800;
    color:#ffffff;

    letter-spacing:2px;

    text-align:center;

    margin-top:3px;
    margin-bottom:20px;

    text-shadow:
        0 0 10px rgba(59,130,246,0.25);
}


.title-logo{
    width:50px;
    height:50px;
}

body{
    min-height: 100vh;
    margin: 0;
    padding: 0 0 80px;
    background: url("bg/gambar6.jpg") center/cover no-repeat;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
}

html, body{
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(4px);
    z-index:0;
}

.container{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;

    margin: 40px auto;
    padding: 26px 22px 18px;

    border-radius: 24px;

    border: 1px solid rgba(59, 130, 246, 0.7);
    background: url("bg/gambar9.jpg")center;
	
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        0 18px 45px rgba(0,0,0,0.55),
        0 0 20px rgba(30,58,138,0.35);

    transition: 0.3s ease;

    animation: fadeUp 0.6s ease;
	padding-bottom: 20px;
	padding-top: 20px;
}

.input-box{

margin-bottom:20px;

}



.field{

display:flex;
align-items:center;

height:55px;

background:#fff;

border-radius:12px;

overflow:hidden;

box-shadow:
0 5px 15px rgba(0,0,0,.15);

transform:translateZ(0);

-webkit-transform:translateZ(0);

}


.icon-box{

    width:55px;
    height:55px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #0ea5e9
    );

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:10px 0 0 10px;
}



.field input{

flex:1;
font-size:20px;
height:100%;

border:none;

outline:none;

padding:0 15px;

border-radius:0 12px 12px 0;

background:#fff;

}



.field input::placeholder{

color:#999;

}



.field:focus-within{

box-shadow:
0 0 0 2px rgba(59,130,246,.35);

}

.field,
.field input,
.icon-box{
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.forgot{
    margin-top:10px;
    text-align:center;
    color:#8fffc0;
    font-size:14px;
    font-weight:bold;
    transition:.25s;
}

.forgot:hover{
    color:#fff;
}

.card{
    border-radius:20px;
    font-size:16px;
    font-weight:bold;
    min-height:230px;
    text-align:left;

    color:#ffffff;
    padding:30px;

    background: url("bg/gambar6.jpg")center;
    border: 1px solid rgba(59, 130, 246, 0.7);

    box-shadow:
        0 30px 40px rgba(0,0,0,0.35),
        0 0 12px rgba(59,130,246,0.25);

    transition:.25s ease;
    overflow:hidden;
}



.label{
    font-weight: 600;
    color: #60a5fa;
}

.box {
         position: relative;
    	 top: 30px;
    }

button {
     width:100%;
  max-width:180px;

  padding:12px;
  border-radius:10px;

  background:#1e3a8a;
  color:white;

  border:1px solid #3b82f6;

  box-shadow:0 6px 15px rgba(0,0,0,0.25);

  cursor:pointer;
  transition:0.25s ease;
  display:block;
  margin:0 auto;
  text-shadow:0 4px 12px rgba(0,0,0,.4);
}

.btn-shadow:hover{
  
  box-shadow:
    0 10px 25px rgba(0,0,0,0.35),
    0 0 12px rgba(59,130,246,0.6);

  background:#2563eb;
}

#copyBtn{
    margin:20px auto 0;

    width:180px;
    height:42px;

    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#1e3a8a,#0ea5e9);

    color:#fff;
    font-size:18px;
    font-weight:700;
	border:1px solid #3b82f6;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    transition:
        box-shadow .25s ease,
        opacity .2s ease;

    box-shadow:
        0 6px 16px rgba(0,0,0,.25),
        0 0 10px rgba(59,130,246,.25);
}

#copyBtn::before{
    content:"";

    position:absolute;
    top:0;
    left:-120%;

    width:12%;
filter:blur(1px);
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.35),
        rgba(255,255,255,0.08),
        transparent
    );

    transform:skewX(-25deg);

    animation:shineMove 3.2s linear infinite;
}

@keyframes shineMove{
    0%{
        left:-120%;
    }

    100%{
        left:160%;
    }
}

.card{
    overflow:hidden;
}

#copyBtn:hover{
    box-shadow:
        0 0 20px rgba(37,99,235,.5),
        0 8px 18px rgba(0,0,0,.25);
}

#copyBtn:active{
    opacity:0.92;
}

#copyBtn.success{
    background:#22c55e !important;

    box-shadow:
        0 12px 25px rgba(0,0,0,.3),
        0 0 15px rgba(34,197,94,.5);
}

@keyframes premiumShine{
    0%{
        left:-70%;
    }
    45%{
        left:140%;
    }
    100%{
        left:140%;
	}
	
}

.brand{
    margin-top:14px;

    display:block;
    width:fit-content;

    margin-left:auto;
    margin-right:auto;

    font-size:9px;

    font-weight:600;
    letter-spacing:0.6px;

    color:rgba(255,255,255,0.9);

    padding:2px 6px;   

    border-radius:6px;

    border:1px solid rgba(96,165,250,0.25);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:0 6px 18px rgba(0,0,0,0.2);
	text-shadow:
    0 1px 2px rgba(0,0,0,0.8),
    0 0 8px rgba(255,255,255,0.15);
}

.brand{
    position:relative;
    top:-20px;
}
	
.resultBox{
    margin-bottom:5px;
}


.resultBox label{

display:block;

margin-bottom:8px;

padding-left:4px;

font-size:18px;

font-weight:700;

color:white;

letter-spacing:.5px;

}



.resultBox p{

position:relative;
font-family:'Outfit',sans-serif;

justify-content:flex-start;

letter-spacing:.3px;
display:flex;

align-items:center;

height:55px;

padding-left:75px;

padding-right:15px;


border-radius:10px;

background:white;


box-shadow:
0 5px 15px rgba(0,0,0,.18);

}



.resultBox p::before{

background:linear-gradient(
135deg,
#2563eb,
#0ea5e9
);

color:white;

}

.resultBox p::before{

position:absolute;

left:0;
top:0;

width:55px;
height:55px;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
135deg,
#2563eb,
#0ea5e9
);

font-size:20px;

border-radius:10px 0 0 10px;

content:"👤";

}


.passwordBox p::before{

content:"🔐";

}



#usernameText,
#password{

font-size:18px;

font-weight:600;

color:#111827;

font-family:'Poppins',sans-serif;

letter-spacing:.3px;

word-break:break-word;

}
	
</style>
</head>
<body>

<div class="overlay"></div>

<div class="container">

    <div class="input-box">

<div class="title">
	<img src="bg/gambar5.jpg" alt="Logo" class="title-logo">
		RESET PASSWORD
    </div>
	<div class="title-line"></div>


<div class="field">

<div class="icon-box">
👤
</div>

<input
type="text"
id="username"
placeholder="Masukkan ID"
oninput="generateData()">

</div>

</div>

    <div class="card">

    <div class="resultBox">

        <label>Username</label>

        <p>
            <span id="usernameText"></span>
        </p>

    </div>


    <div class="resultBox passwordBox">

        <label>Password</label>

        <p>
            <span id="password"></span>
        </p>

    </div>

</div>


<button id="copyBtn" onclick="copyData()">
    SALIN
</button>

</div>

</div>

<div class="brand">
    © 2026 | BY YOGIK
</div>

<script>
function generateData() {
    let username = document.getElementById("username").value;

    if (username === "") {
        document.getElementById("usernameText").innerText = "";
        document.getElementById("password").innerText = "";
        return;
    }

    let angka = Math.floor(100 + Math.random() * 900);

    let words = [
        "mantap", "gambar", "teko", "kasti", "lomba", "mujur", "balap", "berani", "keren", "gas", "santai", "kereta", "jos", "awan", "buku", "dermaga", "embun", "gitar", "hujan", "impian", "jangkar", "kopi", "langit", "malam", "nyala", "ombak", "pintu", "quiz", "rumah", "senja", "tanah", "vokal", "bayang", "cahaya", "daun", "gelap", "hati", "ikan", "jarak", "antar", "baris", "klik", "kartu", "format", "rapi", "urusan", "lapar", "langkah", "boleh", "ringan", "singkat", "berani", "tumbuh", "kawan", "berjuang", "pernah", "cahaya", "harapan", "bijak", "petualangan", "solusi", "gairah", "bergerak", "jago", "runcing", "super", "kapal", "madu", "oke"
    ];

    let randomWord = words[Math.floor(Math.random() * words.length)];

    let password = randomWord + angka;

    document.getElementById("usernameText").innerText = username;
    document.getElementById("password").innerText = password;
}

function copyData() {
    let u = document.getElementById("usernameText").innerText;
    let p = document.getElementById("password").innerText;

    if(!u || !p) return;

    let text = `Username: ${u}\nPassword: ${p} \n\nGunakan link alternatif dibawah ini jika tidak bisa akses situs : \nhttps://gesya.me/mnttutama`;
	

    navigator.clipboard.writeText(text).then(()=>{

        let btn = document.getElementById("copyBtn");

        // reset class dulu biar animasi selalu jalan
        btn.classList.remove("success");
        void btn.offsetWidth;

        btn.classList.add("success");
        btn.innerText = "✅ TERSALIN";

        // HANYA RESET INPUT
        let input = document.getElementById("username");

input.value = "";
input.blur();

        setTimeout(()=>{
            btn.classList.remove("success");
            btn.innerText = "SALIN";
        },1200);
    });
}
</script>
</body>
</html>
